services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: marmitas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: marmitas_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marmitas_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: marmitas-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: marmitas-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marmitas-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=marmitas_db;Username=postgres;Password=postgres_password"
      ConnectionStrings__Redis: "redis:6379"
      Jwt__Issuer: "marmitas-api"
      Jwt__Audience: "marmitas-clients"
      Jwt__Key: "chave-secreta-producao-minimo-32-caracteres-2026"
      Jwt__ExpirationMinutes: "15"
    ports:
      - "8080:8080"

volumes:
  pgdata:
